<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuadraPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="launcher">
    <div style="width:100%;max-width:720px">
      <div class="login-brand" style="margin-bottom:26px">
        <div class="logo" style="width:64px;height:64px;border-radius:18px">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" style="width:34px;height:34px">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8l3.5 2.5-1.3 4.1h-4.4L8.5 10.5z" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <h1 style="font-size:26px;margin-top:14px">QuadraPro</h1>
        <p>Sistema de gestão para quadras e arenas multi-tenant</p>
      </div>
      <div class="launch-grid">
        <a class="launch-card" href="portal.html">
          <div class="ic g-tint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:28px;height:28px">
              <rect x="3" y="4" width="18" height="17" rx="2"/>
              <path d="M3 9h18M8 2v4M16 2v4"/>
            </svg>
          </div>
          <h3>Sou dono de quadra</h3>
          <p>Acesse seu portal para gerenciar agenda, clientes e vendas ou cadastre sua quadra.</p>
        </a>
        <a class="launch-card" href="admin.html">
          <div class="ic b-tint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:28px;height:28px">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 0 0 0 18M12 3a14 14 0 0 1 0 18"/>
            </svg>
          </div>
          <h3>Sou administrador</h3>
          <p>Painel Super Admin — gerencie quadras clientes, planos, solicitações e arrecadação.</p>
        </a>
      </div>
    </div>
  </div>
  <script src="db.js"></script>
  <script>initTheme()</script>
</body>
</html>
